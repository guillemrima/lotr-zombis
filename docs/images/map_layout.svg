<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="room1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="roomForgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="url(#mapBg)" rx="16" />
  <rect x="14" y="14" width="1072" height="652" fill="none" stroke="url(#goldAccent)" stroke-width="1.5" rx="12" opacity="0.8" />
  
  <!-- Grid lines (tactical blueprint) -->
  <g stroke="#1f2937" stroke-width="0.75" opacity="0.6">
    <line x1="60" y1="0" x2="60" y2="680" />
    <line x1="180" y1="0" x2="180" y2="680" />
    <line x1="300" y1="0" x2="300" y2="680" />
    <line x1="420" y1="0" x2="420" y2="680" />
    <line x1="540" y1="0" x2="540" y2="680" />
    <line x1="660" y1="0" x2="660" y2="680" />
    <line x1="780" y1="0" x2="780" y2="680" />
    <line x1="900" y1="0" x2="900" y2="680" />
    <line x1="1020" y1="0" x2="1020" y2="680" />
    <line x1="0" y1="80" x2="1100" y2="80" />
    <line x1="0" y1="180" x2="1100" y2="180" />
    <line x1="0" y1="280" x2="1100" y2="280" />
    <line x1="0" y1="380" x2="1100" y2="380" />
    <line x1="0" y1="480" x2="1100" y2="480" />
    <line x1="0" y1="580" x2="1100" y2="580" />
  </g>

  <!-- Header Title -->
  <text x="550" y="50" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="22" font-weight="bold" fill="#fef08a" letter-spacing="4">
    PLANO TÁCTICO: LAS 5 CÁMARAS DE MORIA (KHAZAD-DÛM)
  </text>
  <text x="550" y="72" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8" letter-spacing="2">
    MAPA DE ZONAS, PUERTAS DESBLOQUEABLES, PERKS, CAJA MISTERIOSA Y PACK-A-PUNCH
  </text>

  <!-- ========================================== -->
  <!-- ZONE 1: CÁMARA DE MAZARBUL (CENTRAL TOP) -->
  <!-- ========================================== -->
  <g transform="translate(420, 100)">
    <rect width="260" height="150" fill="url(#room1Grad)" stroke="#38bdf8" stroke-width="2" rx="8" />
    <rect x="0" y="0" width="260" height="26" fill="#0284c7" fill-opacity="0.3" rx="8" />
    <text x="130" y="18" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">
      ZONA 1: CÁMARA DE MAZARBUL (SPAWN)
    </text>
    
    <!-- Tomb of Balin -->
    <rect x="100" y="55" width="60" height="35" fill="#334155" stroke="#facc15" stroke-width="1.5" rx="3" />
    <text x="130" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fef08a" font-weight="bold">TUMBA BALIN</text>
    
    <!-- Windows & Wall Buys -->
    <text x="20" y="48" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">🪟 Ventana #1 &amp; #2 (Oeste)</text>
    <text x="240" y="48" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Ventana #3 &amp; #4 (Este) 🪟</text>
    
    <!-- Perks & Items in Room 1 -->
    <rect x="15" y="110" width="105" height="26" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" rx="4" />
    <text x="67" y="127" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#c7d2fe">🏹 Arco Lothlórien (Wall)</text>
    
    <rect x="140" y="110" width="105" height="26" fill="#701a75" stroke="#f472b6" stroke-width="1" rx="4" />
    <text x="192" y="127" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fbcfe8">🍷 Beorn Mead (2500P)</text>
  </g>

  <!-- Door 1 -> Zone 2 Connection -->
  <g transform="translate(550, 250)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,2" />
    <rect x="-65" y="8" width="130" height="22" fill="#78350f" stroke="#facc15" stroke-width="1" rx="11" />
    <text y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#fef08a">🚪 PUERTA I · 1250 PTS</text>
  </g>

  <!-- ========================================== -->
  <!-- ZONE 2: GRAN SALA DE LOS PILARES (CENTER) -->
  <!-- ========================================== -->
  <g transform="translate(370, 290)">
    <rect width="360" height="155" fill="url(#room1Grad)" stroke="#64748b" stroke-width="2" rx="8" />
    <rect x="0" y="0" width="360" height="26" fill="#475569" fill-opacity="0.3" rx="8" />
    <text x="180" y="18" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">
      ZONA 2: GRAN SALA DE LOS PILARES (TÚNEL CENTRAL)
    </text>

    <!-- Pillars -->
    <circle cx="90" cy="65" r="14" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <text x="90" y="69" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#e2e8f0">PILAR</text>
    <circle cx="270" cy="65" r="14" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <text x="270" y="69" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#e2e8f0">PILAR</text>
    
    <circle cx="90" cy="115" r="14" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <text x="90" y="119" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#e2e8f0">PILAR</text>
    <circle cx="270" cy="115" r="14" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <text x="270" y="119" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#e2e8f0">PILAR</text>

    <!-- Mid Perks & Wall buys -->
    <rect x="125" y="80" width="110" height="24" fill="#065f46" stroke="#34d399" stroke-width="1" rx="4" />
    <text x="180" y="96" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#a7f3d0">🍺 Cerveza Comarca (2000P)</text>
    
    <text x="180" y="138" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#cbd5e1">🎯 Ballesta de Erebor (Pared · 1000P)</text>
  </g>

  <!-- Door Connections from Zone 2 to Zone 3 & 4 -->
  <!-- Left to Zone 3 -->
  <g transform="translate(370, 360)">
    <line x1="0" y1="0" x2="-80" y2="0" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,2" />
    <rect x="-70" y="-14" width="60" height="28" fill="#78350f" stroke="#facc15" stroke-width="1" rx="6" />
    <text x="-40" y="3" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#fef08a">PUERTA 3</text>
    <text x="-40" y="12" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#fef08a">1500P</text>
  </g>
  <!-- Right to Zone 4 -->
  <g transform="translate(730, 360)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,2" />
    <rect x="10" y="-14" width="60" height="28" fill="#78350f" stroke="#facc15" stroke-width="1" rx="6" />
    <text x="40" y="3" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#fef08a">PUERTA 4</text>
    <text x="40" y="12" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#fef08a">1500P</text>
  </g>

  <!-- ========================================== -->
  <!-- ZONE 3: GALERÍA REAL DE DURIN (WEST WING) -->
  <!-- ========================================== -->
  <g transform="translate(60, 270)">
    <rect width="230" height="190" fill="url(#room1Grad)" stroke="#fbbf24" stroke-width="1.5" rx="8" />
    <rect x="0" y="0" width="230" height="26" fill="#854d0e" fill-opacity="0.3" rx="8" />
    <text x="115" y="18" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#fde047">
      ZONA 3: GALERÍA REAL DE DURIN
    </text>

    <!-- Throne / Upper Balcony -->
    <rect x="25" y="45" width="180" height="32" fill="#1e293b" stroke="#eab308" stroke-width="1" rx="4" />
    <text x="115" y="65" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fef08a">👑 TRONO DE KHAZAD-DÛM (+2.8m)</text>

    <rect x="35" y="95" width="160" height="32" fill="#047857" stroke="#6ee7b7" stroke-width="1" rx="6" />
    <text x="115" y="111" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#d1fae5">🍞 Pan de Lembas</text>
    <text x="115" y="123" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#a7f3d0">SPEED COLA (+35% RECARGA) · 3000P</text>

    <text x="115" y="155" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">🪟 Ventana Flanco Oeste #7</text>
  </g>

  <!-- ========================================== -->
  <!-- ZONE 4: MINAS PROFUNDAS DE MITHRIL (EAST) -->
  <!-- ========================================== -->
  <g transform="translate(810, 270)">
    <rect width="230" height="190" fill="url(#room1Grad)" stroke="#c084fc" stroke-width="1.5" rx="8" />
    <rect x="0" y="0" width="230" height="26" fill="#581c87" fill-opacity="0.3" rx="8" />
    <text x="115" y="18" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#e9d5ff">
      ZONA 4: MINAS DE MITHRIL
    </text>

    <!-- Mystery Box -->
    <rect x="25" y="45" width="180" height="40" fill="#3b0764" stroke="#c084fc" stroke-width="1.5" rx="6" />
    <text x="115" y="63" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#f5d0fe">✨ COFRE DE LOS NOLDOR</text>
    <text x="115" y="78" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#d8b4fe">CAJA MISTERIOSA · 950 PTS</text>

    <!-- Mithril Repeater Wall Buy -->
    <rect x="25" y="100" width="180" height="32" fill="#082f49" stroke="#38bdf8" stroke-width="1" rx="4" />
    <text x="115" y="116" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#bae6fd">⚡ Repetidora de Mithril</text>
    <text x="115" y="127" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#7dd3fc">CADENCIA 190ms · 1850 PTS</text>

    <text x="115" y="155" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">🪟 Ventanas Este #8 &amp; #9</text>
  </g>

  <!-- Door 2 -> Zone 5 Bridge Connection -->
  <g transform="translate(550, 445)">
    <line x1="0" y1="0" x2="0" y2="45" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,2" />
    <rect x="-75" y="10" width="150" height="24" fill="#991b1b" stroke="#f87171" stroke-width="1" rx="12" />
    <text y="26" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#fee2e2">🚪 PUERTA ABISAL · 2000 PTS</text>
  </g>

  <!-- ========================================== -->
  <!-- ZONE 5: FORJA ABISAL & PUENTE KHAZAD-DÛM -->
  <!-- ========================================== -->
  <g transform="translate(320, 495)">
    <rect width="460" height="150" fill="url(#roomForgeGrad)" stroke="#f97316" stroke-width="2" rx="8" />
    <rect x="0" y="0" width="460" height="26" fill="#c2410c" fill-opacity="0.3" rx="8" />
    <text x="230" y="18" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#fdba74">
      ZONA 5: PUENTE DE KHAZAD-DÛM &amp; FORJA ABISAL (PACK-A-PUNCH)
    </text>

    <!-- Narrow Bridge representation -->
    <rect x="180" y="38" width="100" height="20" fill="#292524" stroke="#78716c" stroke-width="1" />
    <text x="230" y="52" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#f5f5f4">PASARELA ABISMAL</text>

    <!-- Pack-a-Punch Station -->
    <rect x="140" y="72" width="180" height="42" fill="#7c2d12" stroke="#fb923c" stroke-width="2" rx="6" />
    <text x="230" y="92" text-anchor="middle" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#fef08a">🔥 FORJA DE CELEBRIMBOR</text>
    <text x="230" y="106" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#ffedd5">PACK-A-PUNCH (EVOLUCIÓN ARMA) · 3000 PTS</text>

    <!-- Perks in Zone 5 -->
    <rect x="20" y="80" width="105" height="35" fill="#14532d" stroke="#4ade80" stroke-width="1" rx="4" />
    <text x="72" y="96" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#bbf7d0">🌟 Luz Eärendil</text>
    <text x="72" y="108" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#86efac">STAMIN-UP · 2000P</text>

    <rect x="335" y="80" width="105" height="35" fill="#450a0a" stroke="#f87171" stroke-width="1" rx="4" />
    <text x="387" y="96" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#fecaca">🔥 Bastón de Anor</text>
    <text x="387" y="108" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#fca5a5">PARED SPLASH · 2500P</text>

    <text x="230" y="136" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fb923c">⚠️ Cuidado con la caída al Vacío de Udûn (Abismo)</text>
  </g>
</svg>
