<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanBeam" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <!-- Gold Borders -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="25%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <!-- Text Gradients -->
    <linearGradient id="titleGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="bloodFire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <!-- Glow Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="380" fill="url(#emberGlow)" rx="16" />
  <rect width="1200" height="380" fill="url(#cyanBeam)" rx="16" />

  <!-- Outer Dwarven Border -->
  <rect x="18" y="18" width="1164" height="344" fill="none" stroke="url(#goldBorder)" stroke-width="2" rx="12" opacity="0.85" />
  <rect x="28" y="28" width="1144" height="324" fill="none" stroke="#ca8a04" stroke-width="0.75" stroke-dasharray="6,4" opacity="0.5" rx="8" />

  <!-- Corner Runes / Celtic Knots -->
  <g fill="none" stroke="url(#goldBorder)" stroke-width="2">
    <!-- Top-Left -->
    <path d="M 38 60 L 38 38 L 60 38 M 46 60 L 46 46 L 60 46" />
    <circle cx="52" cy="52" r="3" fill="#facc15" />
    <!-- Top-Right -->
    <path d="M 1162 60 L 1162 38 L 1140 38 M 1154 60 L 1154 46 L 1140 46" />
    <circle cx="1148" cy="52" r="3" fill="#facc15" />
    <!-- Bottom-Left -->
    <path d="M 38 320 L 38 342 L 60 342 M 46 320 L 46 334 L 60 334" />
    <circle cx="52" cy="328" r="3" fill="#facc15" />
    <!-- Bottom-Right -->
    <path d="M 1162 320 L 1162 342 L 1140 342 M 1154 320 L 1154 334 L 1140 334" />
    <circle cx="1148" cy="328" r="3" fill="#facc15" />
  </g>

  <!-- Ambient Floating Embers -->
  <g opacity="0.6">
    <circle cx="160" cy="110" r="1.5" fill="#f59e0b" />
    <circle cx="280" cy="80" r="2.2" fill="#ef4444" />
    <circle cx="410" cy="140" r="1.8" fill="#fbbf24" />
    <circle cx="780" cy="95" r="2.5" fill="#f97316" />
    <circle cx="940" cy="130" r="1.6" fill="#f59e0b" />
    <circle cx="1060" cy="90" r="2.0" fill="#ef4444" />
    <circle cx="220" cy="270" r="2.0" fill="#38bdf8" />
    <circle cx="980" cy="290" r="2.2" fill="#38bdf8" />
  </g>

  <!-- Lore Header Subtitle -->
  <text x="600" y="85" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="16" letter-spacing="8" fill="#cbd5e1" opacity="0.9">
    CÁMARA DE MAZARBUL · MINAS DE MORIA
  </text>

  <!-- Main Ring Verse Runes Top & Bottom -->
  <text x="600" y="112" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="13" letter-spacing="14" fill="#a16207" opacity="0.75">
    ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ · ASH NAZG DURBATULÛK · ᚲ ᚱ ᚨ ᚦ ᚢ ᚠ
  </text>

  <!-- Epic Main Title -->
  <text x="600" y="172" text-anchor="middle" font-family="'Cinzel Decorative', 'Cinzel', 'Georgia', serif" font-weight="900" font-size="52" letter-spacing="6" fill="url(#titleGold)" filter="url(#glowGold)">
    THE LORD OF THE RINGS
  </text>

  <text x="600" y="235" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" letter-spacing="10" fill="url(#bloodFire)" filter="url(#glowRed)">
    ZOMBIES · KHAZAD-DÛM
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="278" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="4" fill="#94a3b8" font-weight="500">
    FIRST-PERSON SURVIVAL HORDE SHOOTER · THREE.JS PBR &amp; ANGULAR 18
  </text>

  <!-- Tactical Feature Badges Bottom Bar -->
  <g transform="translate(600, 318)" text-anchor="middle">
    <!-- Badge 1: Rounds -->
    <g transform="translate(-320, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text y="5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#38bdf8" font-weight="600">🛡️ ONDAS DE TRASGOS</text>
    </g>
    <!-- Badge 2: Pack a punch -->
    <g transform="translate(-105, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#1e293b" stroke="#ca8a04" stroke-width="1" />
      <text y="5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#facc15" font-weight="600">⚡ FORJA CELEBRIMBOR</text>
    </g>
    <!-- Badge 3: Perks -->
    <g transform="translate(110, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text y="5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#4ade80" font-weight="600">🧪 4 ELIXIRES / PERKS</text>
    </g>
    <!-- Badge 4: Mystery Box -->
    <g transform="translate(320, 0)">
      <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#7e22ce" stroke-width="1" />
      <text y="5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c084fc" font-weight="600">✨ COFRE NOLDOR 950P</text>
    </g>
  </g>
</svg>
