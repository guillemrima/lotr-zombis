    <text x="155" y="328" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">
      📍 <tspan fill="#f5d0fe" font-weight="600">Exclusiva Caja Misteriosa</tspan> (950 pts)
    </text>
  </g>

