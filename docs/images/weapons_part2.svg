  </text>

  <!-- ========================================== -->
  <!-- WEAPON 4: REPETIDORA DE MITHRIL -->
  <!-- ========================================== -->
  <g transform="translate(45, 85)" filter="url(#shadowW2)">
    <rect width="310" height="365" fill="url(#wCardBg2)" stroke="#22d3ee" stroke-width="1.5" rx="12" />
    <!-- Art Header -->
