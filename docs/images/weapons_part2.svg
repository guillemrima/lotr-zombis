    <text x="155" y="161" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#e0e7ff">
      ⚡ Mejora: Sentencia de los Valar
    </text>

    <!-- Stats -->
    <g transform="translate(25, 185)">
      <text y="12" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">Daño por impacto</text>
      <text x="260" y="12" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold" fill="#f43f5e">320 PTS (Brutal)</text>
      <rect y="17" width="260" height="5" fill="#334155" rx="2.5" />
      <rect y="17" width="260" height="5" fill="#f43f5e" rx="2.5" />

      <text y="38" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">Cadencia de fuego</text>
      <text x="260" y="38" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold" fill="#f59e0b">760 ms</text>
      <rect y="43" width="260" height="5" fill="#334155" rx="2.5" />
      <rect y="43" width="75" height="5" fill="#f59e0b" rx="2.5" />

      <text y="64" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">Cargador / Reserva</text>
      <text x="260" y="64" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold" fill="#818cf8">6 / 36 cargas</text>
      <rect y="69" width="260" height="5" fill="#334155" rx="2.5" />
      <rect y="69" width="70" height="5" fill="#818cf8" rx="2.5" />

      <text y="90" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">Radio de Explosión</text>
      <text x="260" y="90" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold" fill="#facc15">4.2 Metros</text>
      <rect y="95" width="260" height="5" fill="#334155" rx="2.5" />
      <rect y="95" width="240" height="5" fill="#facc15" rx="2.5" />
    </g>

    <!-- Source tag -->
