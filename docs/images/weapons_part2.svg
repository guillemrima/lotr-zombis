    <circle cx="135" cy="51" r="9" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" />
    <line x1="195" y1="46" x2="205" y2="46" stroke="#67e8f9" stroke-width="3" />
    <line x1="195" y1="56" x2="205" y2="56" stroke="#67e8f9" stroke-width="3" />

