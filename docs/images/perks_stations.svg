<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="pGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="pGlow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1100" height="480" fill="#070a12" rx="16" />

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="22" font-weight="bold" fill="url(#pGold)" letter-spacing="4">
    BREBAJES Y ESTACIONES ANCESTRALES (PERKS &amp; PACK-A-PUNCH)
  </text>
  <text x="550" y="64" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8" letter-spacing="1">
    SISTEMA DE PROGRESIÓN Y MEJORA DE PERSONAJE INSPIRADO EN CALL OF DUTY ZOMBIES
  </text>

  <!-- ========================================== -->
  <!-- 4 PERKS CARDS (ROW 1) -->
  <!-- ========================================== -->
  <!-- Perk 1: Beorn Mead -->
  <g transform="translate(45, 85)" filter="url(#pGlow)">
    <rect width="235" height="185" fill="url(#pBg)" stroke="#f43f5e" stroke-width="1.5" rx="10" />
    <circle cx="117" cy="45" r="24" fill="#881337" stroke="#fb7185" stroke-width="2" />
    <text x="117" y="52" text-anchor="middle" font-size="20">🍷</text>
    <text x="117" y="90" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="bold" fill="#fda4af">
      HIDROMIEL BEORN
    </text>
    <text x="117" y="105" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#f43f5e" font-weight="bold">
      EQUIV. JUGGERNOG · 2500P
    </text>
    <text x="117" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
      Salud máxima de 100 a 250 HP.
    </text>
    <text x="117" y="145" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
      Sobrevive hasta 5-6 golpes.
    </text>
    <text x="117" y="168" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">
      📍 Cámara Mazarbul (Spawn)
    </text>
  </g>

  <!-- Perk 2: Lembas Bread -->
  <g transform="translate(300, 85)" filter="url(#pGlow)">
    <rect width="235" height="185" fill="url(#pBg)" stroke="#10b981" stroke-width="1.5" rx="10" />
    <circle cx="117" cy="45" r="24" fill="#064e3b" stroke="#34d399" stroke-width="2" />
    <text x="117" y="52" text-anchor="middle" font-size="20">🍞</text>
    <text x="117" y="90" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="bold" fill="#6ee7b7">
      PAN DE LEMBAS
    </text>
    <text x="117" y="105" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#10b981" font-weight="bold">
      EQUIV. SPEED COLA · 3000P
    </text>
    <text x="117" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
      +35% velocidad de recarga.
    </text>
    <text x="117" y="145" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
      Cambio de arma instantáneo.
    </text>
    <text x="117" y="168" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">
      📍 Galería Real de Durin
    </text>
  </g>

  <!-- Perk 3: Shire Ale -->
  <g transform="translate(555, 85)" filter="url(#pGlow)">
    <rect width="235" height="185" fill="url(#pBg)" stroke="#f59e0b" stroke-width="1.5" rx="10" />
    <circle cx="117" cy="45" r="24" fill="#78350f" stroke="#fcd34d" stroke-width="2" />
    <text x="117" y="52" text-anchor="middle" font-size="20">🍺</text>
    <text x="117" y="90" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="bold" fill="#fde68a">
      CERVEZA COMARCA
    </text>
    <text x="117" y="105" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#f59e0b" font-weight="bold">
      EQUIV. DOUBLE TAP · 2000P
    </text>
    <text x="117" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
      Cadencia aumentada +15%.
    </text>
    <text x="117" y="145" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
      Daño de virotes potenciado.
    </text>
    <text x="117" y="168" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">
      📍 Sala de los Pilares
    </text>
  </g>

  <!-- Perk 4: Eärendil Light -->
  <g transform="translate(810, 85)" filter="url(#pGlow)">
    <rect width="235" height="185" fill="url(#pBg)" stroke="#06b6d4" stroke-width="1.5" rx="10" />
    <circle cx="117" cy="45" r="24" fill="#164e63" stroke="#67e8f9" stroke-width="2" />
    <text x="117" y="52" text-anchor="middle" font-size="20">🌟</text>
    <text x="117" y="90" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="bold" fill="#a5f3fc">
      LUZ DE EÄRENDIL
    </text>
    <text x="117" y="105" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#06b6d4" font-weight="bold">
      EQUIV. STAMIN-UP · 2000P
    </text>
    <text x="117" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
      +30% velocidad de sprint.
    </text>
    <text x="117" y="145" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
      Agilidad para esquivar orcos.
    </text>
    <text x="117" y="168" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">
      📍 Puente de Khazad-dûm
    </text>
  </g>

  <!-- ========================================== -->
  <!-- 2 STATIONS CARDS (ROW 2) -->
  <!-- ========================================== -->
  <!-- Station 1: Mystery Box -->
  <g transform="translate(45, 290)" filter="url(#pGlow)">
    <rect width="490" height="165" fill="url(#pBg)" stroke="#c084fc" stroke-width="1.5" rx="10" />
    <rect x="20" y="25" width="65" height="50" fill="#3b0764" stroke="#e879f9" stroke-width="1.5" rx="6" />
    <text x="52" y="57" text-anchor="middle" font-size="26">✨</text>
    
    <text x="105" y="45" font-family="'Cinzel', serif" font-size="16" font-weight="bold" fill="#e879f9">
      COFRE DE LOS NOLDOR (CAJA MISTERIOSA)
    </text>
    <text x="105" y="64" font-family="'Segoe UI', sans-serif" font-size="12" fill="#d8b4fe" font-weight="bold">
      COSTE: 950 PUNTOS · POOL DE 5 ARMAS
    </text>
    <text x="105" y="92" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
      Otorga un arma aleatoria del arsenal, incluyendo armas exclusivas como el
    </text>
    <text x="105" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f0abfc" font-weight="bold">
      Arco Negro de Bardo y el legendario Martillo de Trueno de Durin.
    </text>
    <text x="105" y="136" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">
      📍 Ubicación: Cámara Este (Minas Profundas de Mithril)
    </text>
  </g>

  <!-- Station 2: Pack a Punch -->
  <g transform="translate(555, 290)" filter="url(#pGlow)">
    <rect width="500" height="165" fill="url(#pBg)" stroke="#fb923c" stroke-width="1.5" rx="10" />
    <rect x="20" y="25" width="65" height="50" fill="#7c2d12" stroke="#fdba74" stroke-width="1.5" rx="6" />
    <text x="52" y="57" text-anchor="middle" font-size="26">🔥</text>

    <text x="105" y="45" font-family="'Cinzel', serif" font-size="16" font-weight="bold" fill="#fed7aa">
      FORJA DE CELEBRIMBOR (PACK-A-PUNCH)
    </text>
    <text x="105" y="64" font-family="'Segoe UI', sans-serif" font-size="12" fill="#fb923c" font-weight="bold">
      COSTE: 3000 PUNTOS · TRANSMUTACIÓN ANCESTRAL
    </text>
    <text x="105" y="92" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
      Evoluciona tu arma equipada a su versión definitiva: proyectiles luminosos,
    </text>
    <text x="105" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fde047" font-weight="bold">
      +50% capacidad de cargador y reserva, y aumento colosal de daño.
    </text>
    <text x="105" y="136" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">
      📍 Ubicación: Zona Sur (Puente de Khazad-dûm sobre el abismo)
    </text>
  </g>
</svg>
